<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aula Circular · laboratorio</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
      <div class="max-w">
        <span class="brand">Aula Circular</span>
        <button type="button" id="menu-boton" class="menu-boton" aria-expanded="false" aria-controls="menu-principal">Abrir menú</button>
        <nav id="menu-principal" class="nav" aria-label="Navegación principal">
          <a href="#inicio" class="nav-link">Inicio</a>
        </nav>
      </div>
    </header>
    <main id="contenido" class="contenido">
      <section id="inicio" class="seccion presentacion" aria-labelledby="titulo-inicio">
        <p class="etiqueta">CENTRO FICTICIO · DATOS DE ENSAYO</p>
        <h1 id="titulo-inicio">Encuentra lo que necesitas para aprender.</h1>
        <p>Biblioteca reúne recursos del centro. Libros recoge materiales del alumnado. Documentación organiza información y formularios por curso.</p>
        <h2 id="catalogo-titulo">Catálogo de muestra</h2>

        <div class="filtros-lab">
          <div>
            <label for="lab-seccion">Área</label>
            <select id="lab-seccion">
              <option value="todas">Todas las áreas</option>
              <option value="biblioteca">Biblioteca</option>
              <option value="libros">Libros</option>
              <option value="documentacion">Documentación</option>
            </select>
          </div>
          <div>
            <label for="lab-busqueda">Buscar por título o curso</label>
            <input id="lab-busqueda" type="search" placeholder="Por ejemplo: programación">
          </div>
          <div class="contenedor-casilla">
            <label class="casilla" for="lab-disponibles">
              <input type="checkbox" id="lab-disponibles">
              <span>Solo disponibles o publicados</span>
            </label>
          </div>
        </div>

        <p id="lab-cuenta" role="status" aria-live="polite"></p>
        <ul id="lab-catalogo" class="tarjeta-grid"></ul>
      </section>
    </main>

    <script src="datos.js"></script>
    <script src="motor.js"></script>
    <script src="catalogo-local.js"></script>
    <script>
      const datosEstandar = [
        { id: 1, titulo: 'Calculadora científica de ejemplo', tipo: 'fisico' },
        { id: 2, titulo: 'Guía de prácticas de ejemplo', tipo: 'digital' }
      ];
      const librosEjemplo = [
        { id: 'L1', titulo: 'Programación paso a paso', modalidad: 'Cesión' },
        { id: 'L2', titulo: 'Bases de datos relacionales', modalidad: 'Intercambio' }
      ];
      const tiposTexto = {
        fisico: ['Préstamo físico', 't-prestamo'],
        digital: ['Descarga digital', 't-digital'],
        enlace: ['Enlace externo', 't-enlace'],
        anuncio: ['Anuncio estudiantil', 't-anuncio']
      };

      async function cargarRecursos(texto = '') {
        try {
          const parametros = new URLSearchParams({ q: texto });
          const respuesta = await fetch('/api/recursos-demo?' + parametros);
          if (respuesta.ok) {
            const { datos } = await respuesta.json();
            return datos || [];
          }
        } catch (e) {
        }
        return datosEstandar.filter(r =>
          r.titulo.toLowerCase().includes(texto.toLowerCase())
        );
      }

      function crearTarjeta(titulo, tipo, extra) {
        const [etiqueta, clase] = tiposTexto[tipo] || [tipo, 't-enlace'];
        const tar = document.createElement('li');
        tar.className = 'tarjeta';
        const ins = document.createElement('p');
        ins.className = 'insignia ' + clase;
        ins.textContent = etiqueta;
        const h3 = document.createElement('h3');
        h3.textContent = titulo;
        tar.append(ins, h3);
        if (extra) {
          const p = document.createElement('p');
          p.textContent = extra;
          tar.append(p);
        }
        return tar;
      }

      async function pintarRecursos(texto = '') {
        const recursos = await cargarRecursos(texto);
        const lista = document.querySelector('#recursos');
        lista.replaceChildren();
        for (const r of recursos) lista.append(crearTarjeta(r.titulo, r.tipo));
        document.querySelector('#estado').textContent = recursos.length
          ? recursos.length + (recursos.length === 1 ? ' recurso encontrado' : ' recursos encontrados')
          : 'No se encontraron recursos. Prueba otra búsqueda.';
      }

      document.addEventListener('DOMContentLoaded', () => {
        pintarRecursos();
        document.querySelector('#filtro').addEventListener('submit', (e) => {
          e.preventDefault();
          pintarRecursos(document.querySelector('#busqueda').value.trim());
        });

        const libros = document.querySelector('#libros-lista');
        for (const l of librosEjemplo) libros.append(crearTarjeta(l.titulo, 'anuncio', 'Modalidad: ' + l.modalidad));

        document.documentElement.classList.add('js');
        const boton = document.querySelector('#menu-boton');
        const menu = document.querySelector('#menu-principal');
        function estadoMenu(abierto) {
          menu.classList.toggle('abierto', abierto);
          boton.setAttribute('aria-expanded', String(abierto));
          boton.textContent = abierto ? 'Cerrar menú' : 'Abrir menú';
        }
        boton.addEventListener('click', () =>
          estadoMenu(boton.getAttribute('aria-expanded') !== 'true'));
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && boton.getAttribute('aria-expanded') === 'true') {
            estadoMenu(false);
            boton.focus();
          }
        });
        menu.querySelectorAll('a').forEach(a =>
          a.addEventListener('click', () => estadoMenu(false)));
      });
    </script>

  </body>
</html>
