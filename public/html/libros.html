<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aula Circular · Libros</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
    <header>
      <div class="max-w">
        <a class="brand" href="index.html">Aula Circular</a>
        <button type="button" id="menu-boton" class="menu-boton" aria-expanded="false" aria-controls="menu-principal">Abrir menú</button>
        <nav id="menu-principal" class="nav" aria-label="Navegación principal">
          <a href="index.html" class="nav-link">Inicio</a>
          <a href="biblioteca.html" class="nav-link" data-area="biblioteca" hidden>Biblioteca</a>
          <a href="libros.html" class="nav-link" data-area="libros" hidden>Libros</a>
          <a href="documentacion.html" class="nav-link" data-area="documentacion" hidden>Documentación</a>
          <a href="mi-espacio.html" class="nav-link" data-area="mi-espacio" hidden>Mi espacio</a>
        </nav>
      </div>
    </header>

<main id="contenido">
      <p><a href="cesiones.html">Cesiones, solicitudes e historial</a></p>
      <p id="aviso-sesion" class="resumen-errores" role="alert" hidden></p>
      <p id="aviso-estado" class="aviso-cuenta" role="status" aria-live="polite" hidden></p>

      <section class="seccion area" aria-labelledby="titulo-libros">
        <h1 id="titulo-libros">Libros</h1>
        <p>Solo aparecen anuncios aprobados por un docente.</p>
        <form id="filtros-libros" class="filtros-lab filtros-catalogo" role="search" aria-label="Filtros de Libros">
          <div>
            <label for="lib-q">Buscar</label>
            <input id="lib-q" name="q" type="search" maxlength="80" placeholder="Título, descripción, curso, ISBN o código">
          </div>
          <div>
            <label for="lib-curso">Curso</label>
            <select id="lib-curso" name="curso">
              <option value="">Todos los cursos</option>
            </select>
          </div>
          <div>
            <label for="lib-modalidad">Modalidad</label>
            <select id="lib-modalidad" name="modalidad">
              <option value="">Todas las modalidades</option>
              <option value="cesion">Cesión</option>
              <option value="prestamo">Préstamo</option>
              <option value="intercambio">Intercambio</option>
            </select>
          </div>
          <div>
            <label class="casilla" for="lib-disponible">
              <input type="checkbox" id="lib-disponible" name="disponible" value="1">
              <span>Solo disponibles</span>
            </label>
          </div>
          <div class="acciones-filtros">
            <button type="submit">Buscar</button>
            <button type="reset" class="boton-sec">Limpiar</button>
          </div>
        </form>
        <p id="mensaje" class="area-estado" role="status" aria-live="polite" tabindex="-1"></p>
        <ul id="libros" class="tarjeta-grid area-lista" aria-labelledby="titulo-libros"></ul>
        <nav id="libros-paginacion" class="paginacion" aria-label="Paginación de Libros" hidden>
          <button type="button" id="anterior" class="boton-sec" disabled>Anterior</button>
          <span id="pagina" aria-live="polite"></span>
          <button type="button" id="siguiente" class="boton-sec" disabled>Siguiente</button>
        </nav>
      </section>
    </main>

    <footer class="pie">
      <p>Aula Circular · Centro ficticio · Datos de ensayo</p>
    </footer>

    <script type="module" src="../mjs/shell.mjs"></script>
    <script type="module" src="../mjs/libros.mjs"></script>
  </body>
</html>
