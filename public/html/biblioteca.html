<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aula Circular · Biblioteca</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
    <header>
      <div class="max-w">
        <a class="brand" href="index.html">Aula Circular</a>
        <button type="button" id="menu-boton" class="menu-boton" aria-expanded="false" aria-controls="menu-principal">Abrir menú</button>
        <nav id="menu-principal" class="nav" aria-label="Navegación principal">
          <a href="index.html" class="nav-link">Inicio</a>
          <a href="biblioteca.html" class="nav-link" data-area="biblioteca" hidden>Biblioteca</a>
          <a href="libros.html" class="nav-link" data-area="libros" hidden>Libros</a>
          <a href="documentacion.html" class="nav-link" data-area="documentacion" hidden>Documentación</a>
          <a href="mi-espacio.html" class="nav-link" data-area="mi-espacio" hidden>Mi espacio</a>
        </nav>
      </div>
    </header>

    <main id="contenido">
      <p id="aviso-sesion" class="resumen-errores" role="alert" hidden></p>
      <p id="aviso-estado" class="aviso-cuenta" role="status" aria-live="polite" hidden></p>

      <section class="seccion area" aria-labelledby="titulo-biblioteca">
        <h1 id="titulo-biblioteca">Biblioteca</h1>
        <p>Recursos del centro: materiales físicos, documentos digitales y enlaces.</p>
        <form id="filtros-biblioteca" class="filtros-lab filtros-catalogo" role="search" aria-label="Filtros de Biblioteca">
          <div>
            <label for="bib-q">Buscar</label>
            <input id="bib-q" name="q" type="search" maxlength="80" placeholder="Título, descripción, curso, ISBN o código">
          </div>
          <div>
            <label for="bib-tipo">Tipo</label>
            <select id="bib-tipo" name="tipo">
              <option value="">Todos los tipos</option>
              <option value="fisico">Físico</option>
              <option value="digital">Digital</option>
              <option value="enlace">Enlace</option>
            </select>
          </div>
          <div>
            <label for="bib-curso">Curso</label>
            <select id="bib-curso" name="curso">
              <option value="">Todos los cursos</option>
            </select>
          </div>
          <div>
            <label class="casilla" for="bib-disponible">
              <input type="checkbox" id="bib-disponible" name="disponible" value="1">
              <span>Solo disponibles</span>
            </label>
          </div>
          <div class="acciones-filtros">
            <button type="submit">Buscar</button>
            <button type="reset" class="boton-sec">Limpiar</button>
          </div>
        </form>
        <p id="bib-cuenta" class="area-estado" role="status" aria-live="polite"></p>
        <ul id="bib-lista" class="tarjeta-grid area-lista" aria-labelledby="titulo-biblioteca"></ul>
        <nav id="bib-paginacion" class="paginacion" aria-label="Paginación de Biblioteca" hidden>
          <button type="button" id="bib-anterior" class="boton-sec" disabled>Anterior</button>
          <span id="bib-pagina" aria-live="polite"></span>
          <button type="button" id="bib-siguiente" class="boton-sec" disabled>Siguiente</button>
        </nav>
      </section>
    </main>

    <footer class="pie">
      <p>Aula Circular · Centro ficticio · Datos de ensayo</p>
    </footer>

    <script type="module" src="../mjs/shell.mjs"></script>
    <script type="module" src="../mjs/biblioteca.mjs"></script>
  </body>
</html>
