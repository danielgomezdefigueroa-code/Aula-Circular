<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis anuncios - Aula Circular</title>
<style>
body{font-family:Arial,sans-serif;max-width:800px;margin:auto;padding:24px;color:#222}
label{display:block;margin-top:12px}input,select,textarea,button{font:inherit;padding:9px;box-sizing:border-box;max-width:100%}
input,select,textarea{width:100%}button{margin:12px 8px 0 0;cursor:pointer}li{padding:16px 0;border-bottom:1px solid #ccc}
fieldset{margin:24px 0;padding:16px}h2{margin-top:28px}#mensaje{white-space:pre-line}textarea{min-height:80px}
</style></head><body>
<a href="/cuenta.html">Mi cuenta</a> | <a href="/libros.html">Libros publicados</a>
<h1>Mis anuncios</h1><p id="perfil"></p><p id="mensaje" role="status" aria-live="polite" tabindex="-1"></p>
<form id="anuncio"><fieldset id="campos" disabled><legend id="leyenda">Nuevo borrador</legend>
<label for="titulo">Título</label><input id="titulo" name="titulo" required maxlength="120">
<label for="curso">Curso del libro</label><select id="curso" name="cursoId" required><option value="">Selecciona un curso</option></select>
<label for="asignatura">Asignatura</label><input id="asignatura" name="asignatura" required maxlength="100">
<label for="edicion">Edición</label><input id="edicion" name="edicion" required maxlength="100" placeholder="Por ejemplo: edición 2024">
<label for="isbn">ISBN (opcional)</label><input id="isbn" name="isbn" maxlength="25">
<label for="conservacion">Estado de conservación</label><textarea id="conservacion" name="conservacion" required maxlength="500" placeholder="Explica si tiene marcas, desgaste o páginas dañadas"></textarea>
<label for="modalidad">Modalidad</label><select id="modalidad" name="modalidad" required>
<option value="cesion">Cesión</option><option value="prestamo">Préstamo</option><option value="intercambio">Intercambio</option></select>
<label for="descripcion">Descripción (opcional)</label><textarea id="descripcion" name="descripcion" maxlength="2000"></textarea>
<p>Se creará un ejemplar propio con un código único. No incluyas teléfonos ni direcciones.</p>
<button id="guardar">Guardar borrador</button><button type="button" id="nuevo">Empezar otro anuncio</button>
</fieldset></form>
<h2>Mis publicaciones</h2><button id="actualizar">Actualizar listado</button><ul id="anuncios"></ul>
<button id="anterior" disabled>Anterior</button><span id="pagina"></span><button id="siguiente" disabled>Siguiente</button>
<section id="detalle" hidden><h2>Historial del anuncio</h2><ul id="historial"></ul></section>
<script type="module" src="/mi-espacio.mjs"></script></body></html>
