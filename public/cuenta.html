<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mi cuenta - Aula Circular</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:700px;margin:auto;padding:24px;color:#222}
    section{margin:28px 0}label{display:block;margin-top:12px}input,select,button{font:inherit;padding:10px;box-sizing:border-box;max-width:100%}
    input,select{width:100%}button{margin-top:16px;cursor:pointer}pre{white-space:pre-wrap}a{color:#174b36}
  </style>
</head>
<body>
  <a href="/">Volver al catálogo de ejemplo</a><h1>Mi cuenta</h1>
  <p id="mensaje" role="status" aria-live="polite"></p>
  <section><h2>Crear cuenta</h2><p>La cuenta se crea pendiente. El curso debe confirmarlo un docente.</p>
    <form id="registro">
      <label for="alias">Alias</label><input id="alias" name="alias" required minlength="2" maxlength="60" autocomplete="nickname">
      <label for="correo-registro">Correo</label><input id="correo-registro" name="correo" type="email" required maxlength="254" autocomplete="email">
      <label for="clave-registro">Contraseña (de 15 a 128 caracteres)</label><input id="clave-registro" name="clave" type="password" required minlength="15" maxlength="128" autocomplete="new-password">
      <label for="curso">Curso solicitado</label><select id="curso" name="cursoId" required><option value="">Selecciona un curso</option></select>
      <button>Crear cuenta pendiente</button>
    </form>
  </section>
  <section><h2>Iniciar sesión</h2><form id="acceso">
    <label for="correo-acceso">Correo</label><input id="correo-acceso" name="correo" type="email" required autocomplete="username">
    <label for="clave-acceso">Contraseña</label><input id="clave-acceso" name="clave" type="password" required minlength="15" maxlength="128" autocomplete="current-password">
    <button>Entrar</button>
  </form></section>
  <section><h2>Mi perfil</h2><p id="perfil">No has iniciado sesión.</p><button id="salida" hidden>Cerrar sesión</button></section>
  <p id="enlace-docente" hidden><a href="/docencia.html">Validar cuentas pendientes (docentes)</a></p>
  <p id="enlace-anuncios" hidden><a href="/mi-espacio.html">Mi espacio: mis anuncios</a></p>
  <script type="module" src="/cuenta.mjs"></script>
</body></html>
